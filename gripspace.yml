version: 2
manifest:
  url: https://github.com/synapt-dev/grip-tutorial.git
  composefile:
    - dest: api/CLAUDE.md
      separator: "\n\n"
      parts:
        - src: standards/CONVENTIONS.md
        - src: api/CLAUDE_FRAG.md
    - dest: web/CLAUDE.md
      separator: "\n\n"
      parts:
        - src: standards/CONVENTIONS.md
        - src: web/CLAUDE_FRAG.md
gripspaces:
  - url: https://github.com/synapt-dev/grip-tutorial.git
    rev: base/main
repos:
  standards:
    url: https://github.com/synapt-dev/grip-tutorial.git
    path: ./standards
    revision: standards/eng
  api:
    url: https://github.com/synapt-dev/grip-tutorial.git
    path: ./api
    revision: api/main
  web:
    url: https://github.com/synapt-dev/grip-tutorial.git
    path: ./web
    revision: web/main
