version: 2
manifest:
  url: https://github.com/synapt-dev/grip-tutorial.git
  composefile:
    - dest: CLAUDE.md
      separator: "\n\n"
      parts:
        - src: STANDARDS.md
        - repo: conventions
          src: CLAUDE.md
gripspaces:
  - url: https://github.com/synapt-dev/grip-tutorial.git
    rev: base/main
repos:
  conventions:
    url: https://github.com/synapt-dev/grip-tutorial.git
    path: ./conventions
    revision: conventions/main
